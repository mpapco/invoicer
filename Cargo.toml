[package]
name = "invoicer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6"
eframe = "0.36"
egui_extras = { version = "0.36", features = ["datepicker"] }
jiff = "0.2"
krilla = "0.8"
payme-qr = { git = "ssh://git@github.com/mpapco/qr-code-generator.git", tag = "0.1" }
rust_decimal = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ttf-parser = "0.25.1"

[dev-dependencies]
egui_kittest = "0.36"
